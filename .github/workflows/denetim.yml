# Her PR'da ve main'e her gönderimde çalışan denetimler. Hepsi yeşil olmadan PR birleştirilmez (CLAUDE.md).
# "Site menüsü" işi her sabah da çalışır: hamour.com.tr menü sayfasının yapısı değişirse kırmızı olur ve
# GitHub depo sahibine e-posta atar (uygulama yine son kayıtlı menüyle çalışır).
name: Denetim

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *' # her gün 07:17 (TSİ)
  workflow_dispatch:

concurrency:
  group: denetim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uygulama:
    name: Uygulama (tip + lint)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo lint --max-warnings 0

  panel:
    name: Panel (derleme)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: panel } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: panel/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  veritabani:
    name: Veritabanı (kural testleri + seed)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: supabase/tests/calistir.sh

  site-menusu:
    name: Site menüsü (hamour.com.tr ile karşılaştırma)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: node araclar/site_menu_test.js
